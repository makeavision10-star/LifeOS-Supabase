.business-entry{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}.business-entry h3{font-size:19px;margin:7px 0}.business-entry p{max-width:540px;margin:0}.business-entry .btn{white-space:nowrap}@media(max-width:650px){.business-entry .btn{width:100%}} .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:22px}.cal-weekday{text-align:center;color:var(--muted);font-size:11px;padding:8px 0}.cal-day{min-height:96px;border:1px solid var(--border);border-radius:8px;padding:6px;overflow:hidden;background:var(--panel2)}.cal-number{border:0;background:transparent;color:var(--text);font-weight:700;padding:3px}.cal-event{background:var(--accent);color:#080c16;border-radius:4px;padding:3px 5px;font-size:10px;margin-top:4px;overflow:hidden;text-overflow:ellipsis}.card,.section{border-radius:var(--card-radius,15px)}@media(max-width:650px){.cal-grid{gap:2px}.cal-day{min-height:62px;padding:2px}.cal-event{font-size:9px;padding:2px}.cal-number{font-size:11px}} </style></head><body><div id="root"></div><script src="app.js" defer></script></body></html>
